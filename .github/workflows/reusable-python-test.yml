# A REUSABLE WORKFLOW: a complete job (with its own runner) that other workflows CALL.
#   - its trigger is "workflow_call"
#   - it can live under any file name in .github/workflows/ (we use the "reusable-" prefix)
#   - it must say where it runs ("runs-on"): the caller does not provide a machine
# A caller uses it as a whole job:
#   jobs:
#     test:
#       uses: nsinha-livevox/github-actions-workflows/.github/workflows/reusable-python-test.yml@v1
#       with:
#         python-versions: '["3.11","3.12"]'

name: Reusable - Python tests

on:
  workflow_call:
    inputs:
      python-versions:
        description: 'JSON list of Python versions to test on, for example ["3.11","3.12"]'
        type: string
        required: false
        default: '["3.12"]'
      test-path:
        description: Folder (or file) that holds the tests
        type: string
        required: false
        default: tests
      requirements:
        description: Path to the requirements file
        type: string
        required: false
        default: requirements.txt

permissions:
  contents: read

jobs:
  test:
    name: pytest on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false                                      # let every version finish
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}   # one job per version
    steps:
      # In a reusable workflow, "checkout" fetches the CALLER's repository.
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.requirements }}

      - name: Install requirements
        env:
          REQUIREMENTS: ${{ inputs.requirements }}
        run: python -m pip install -r "$REQUIREMENTS"

      - name: Run the tests
        env:
          TEST_PATH: ${{ inputs.test-path }}
        run: python -m pytest "$TEST_PATH" -v --junitxml=test-report.xml

      # always(): keep the report even when a test failed, which is when you need it most.
      - name: Keep the test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-report-python-${{ matrix.python-version }}
          path: test-report.xml
          if-no-files-found: ignore

      - name: Summary
        if: ${{ always() }}
        uses: nsinha-livevox/github-actions-workflows/.github/actions/write-summary@v1
        with:
          title: Python ${{ matrix.python-version }}
          message: Tests finished with status **${{ job.status }}**.
